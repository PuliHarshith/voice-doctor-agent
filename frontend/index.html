<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      rel="stylesheet"
    />
    <!-- Apply the saved theme before first paint, so Ink users never see a flash of Paper. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'ink') document.documentElement.dataset.theme = 'ink'
      } catch {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
